apiVersion: v1
kind: Service
metadata:
  name: nodejs-secure-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
spec:
  type: LoadBalancer
  selector:
    app: nodejs-app
  ports:
    - protocol: TCP
      port: 80         # Port exposed to the public internet
      targetPort: 3000 # Internally routes to our container port
