apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-secure-app
  labels:
    app: nodejs-app
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: web-app
        image: your-dockerhub-username/nodejs-secure-app:v1.0.0
        ports:
        - containerPort: 3000
        # Resource Management: Safeguarding cluster memory and CPU
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        # Health Checks: Keeping the application self-healing
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
